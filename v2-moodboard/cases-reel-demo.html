<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cases.910 — jackpot reel demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Modak&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#f0ede8; --ink:#0a0a0a; --blue:#3366ff; --head:60px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#070707; }
  body { font-family:"IBM Plex Mono",monospace; }
  .modak { font-family:"Modak",system-ui,cursive; font-weight:400; }

  /* header */
  .top {
    position:fixed; top:0; left:0; right:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    height:var(--head); padding:0 24px;
    border-bottom:2px solid var(--ink); background:var(--paper);
  }
  .top .logo { display:flex; align-items:center; gap:9px; }
  .top .logo .badge {
    border:2px dashed #9b958a; padding:3px 6px;
    font-size:8px; letter-spacing:0.2em; text-transform:uppercase; color:#9b958a;
  }
  .top .logo .word { font-size:22px; color:var(--ink); }
  .top a { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink); text-decoration:none; }

  /* ===== the machine — the slot window, below the header ===== */
  .machine {
    position:fixed; top:var(--head); left:0; right:0; bottom:0;
    overflow:hidden; background:#070707;
  }

  /* ===== the film tape (reel) ===== */
  .reel-shake { position:relative; will-change:transform; }
  .reel { will-change:transform,filter; }
  .flicker {
    position:absolute; inset:0; z-index:51; pointer-events:none;
    background:#000; opacity:0;
  }
  .frame {
    position:relative;
    height:calc(100vh - var(--head));
    width:100%; overflow:hidden;
  }
  /* black film borders w/ sprocket holes — continuous down the whole tape */
  .frame::before, .frame::after {
    content:""; position:absolute; top:0; bottom:0; width:60px; z-index:2;
    background:repeating-linear-gradient(
      var(--ink) 0, var(--ink) 21px,
      var(--paper) 21px, var(--paper) 42px
    );
  }
  .frame::before { left:0; }
  .frame::after  { right:0; }
  /* the colored content panel */
  .panel {
    position:absolute; inset:0 60px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 6vw; overflow:hidden;
    border-top:3px solid var(--ink); border-bottom:3px solid var(--ink);
  }
  .panel .num { font-size:clamp(2rem,4.5vw,3.4rem); line-height:0.8; opacity:0.8; }
  .panel .title { font-size:clamp(3rem,9vw,8rem); line-height:0.82; margin-top:2px; }
  .panel .client { font-size:12px; letter-spacing:0.15em; text-transform:uppercase; margin-top:18px; }
  .panel .scope { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.66; margin-top:5px; }
  .panel .cta {
    margin-top:24px; display:inline-block;
    border:3px solid currentColor; padding:11px 26px;
    font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
  }

  /* ===== slot window overlay ===== */
  .window { position:absolute; inset:0; z-index:50; pointer-events:none; }
  .window .vig {
    position:absolute; inset:0;
    background:linear-gradient(#070707 0%, transparent 17%, transparent 83%, #070707 100%);
  }
  .bracket { position:absolute; width:40px; height:40px; border:4px solid var(--blue); }
  .bracket.tl { top:34px;  left:84px;  border-right:0; border-bottom:0; }
  .bracket.tr { top:34px;  right:84px; border-left:0;  border-bottom:0; }
  .bracket.bl { bottom:34px; left:84px;  border-right:0; border-top:0; }
  .bracket.br { bottom:34px; right:84px; border-left:0;  border-top:0; }

  .flash { position:absolute; inset:0; z-index:52; pointer-events:none; background:var(--paper); opacity:0; }

  .counter {
    position:fixed; z-index:65; right:24px; bottom:24px;
    background:var(--ink); color:var(--paper);
    border:3px solid var(--paper); padding:8px 14px;
    font-size:14px; letter-spacing:0.08em;
    box-shadow:5px 5px 0 var(--blue);
  }
  .hint {
    position:fixed; z-index:65; left:50%; bottom:26px; transform:translateX(-50%);
    color:#7d776e; font-size:10px; letter-spacing:0.25em; text-transform:uppercase;
    animation:bob 1.8s ease-in-out infinite;
  }

  /* navigate indicator — connected dots, one per project */
  .nav {
    position:fixed; left:26px; top:50%; transform:translateY(-50%);
    z-index:66; display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .nav::before {
    content:""; position:absolute; left:50%; top:8px; bottom:8px;
    width:2px; margin-left:-1px; background:var(--paper-dark);
  }
  .nav-item {
    width:15px; height:15px; border-radius:999px; padding:0; cursor:pointer;
    border:3px solid var(--paper); background:#070707;
    transition:width .22s ease, height .22s ease, background .18s, border-color .18s, transform .18s;
  }
  .nav-item:hover { transform:scale(1.2); }
  .nav-item.active {
    width:17px; height:46px;
    background:var(--blue); border-color:var(--blue);
  }
  @keyframes bob { 0%,100%{transform:translate(-50%,0);} 50%{transform:translate(-50%,5px);} }
</style>
</head>
<body>
  <header class="top">
    <div class="logo">
      <span class="badge">logo</span>
      <span class="word modak">cases</span>
    </div>
    <a href="#">910.studio &#8599;</a>
  </header>

  <div class="machine">
    <div class="reel-shake" id="shake">
      <div class="reel" id="reel"></div>
    </div>
    <div class="window">
      <div class="vig"></div>
      <span class="bracket tl"></span><span class="bracket tr"></span>
      <span class="bracket bl"></span><span class="bracket br"></span>
    </div>
    <div class="flicker" id="flicker"></div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="counter modak" id="counter">N&deg;01</div>
  <p class="hint">scroll &mdash; pull the lever &#8595;</p>
  <nav class="nav" id="nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
  const PROJECTS = [
    { n:"N&deg;01", title:"Juraan",   client:"Lkhagvasuren Nyamkhuu",   scope:"research / design / custom font / frontend", bg:"#f0ede8", fg:"#0a0a0a" },
    { n:"N&deg;02", title:"MarketIQ", client:"Capital Markets Mongolia", scope:"design system / token architecture / frontend", bg:"#3366ff", fg:"#f0ede8" },
    { n:"N&deg;03", title:"Reel 3",   client:"in the darkroom",          scope:"developing", bg:"#0a0a0a", fg:"#f0ede8" },
    { n:"N&deg;04", title:"Reel 4",   client:"in the darkroom",          scope:"developing", bg:"#dbd6cf", fg:"#0a0a0a" },
  ];
  const N = PROJECTS.length;
  const REPS = 40;

  const reel = document.getElementById("reel");
  let html = "";
  for (let r = 0; r < REPS; r++) {
    for (let i = 0; i < N; i++) {
      const p = PROJECTS[i];
      html += `<div class="frame"><div class="panel" style="background:${p.bg};color:${p.fg}">
        <span class="num modak">${p.n}</span>
        <span class="title modak">${p.title}</span>
        <span class="client">${p.client}</span>
        <span class="scope">${p.scope}</span>
        <span class="cta">view case study &#8594;</span>
      </div></div>`;
    }
  }
  reel.innerHTML = html;

  const counter = document.getElementById("counter");
  const flash = document.getElementById("flash");
  const navEl = document.getElementById("nav");

  // build the navigate indicator — one marker per project, click to jump
  PROJECTS.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "nav-item";
    b.title = p.title;
    b.addEventListener("click", () => spinTo(i));
    navEl.appendChild(b);
  });
  function updateNav() {
    const cur = ((index % N) + N) % N;
    [...navEl.children].forEach((b, i) => b.classList.toggle("active", i === cur));
  }
  let frameH = window.innerHeight - 60;
  let index = (REPS / 2) * N;        // start mid-tape, on Juraan
  let spinning = false;
  let ready = false;
  setTimeout(() => (ready = true), 450);   // ignore any stray load-time wheel

  gsap.set(reel, { y: -index * frameH });
  updateCounter();
  updateNav();

  function updateCounter() {
    counter.innerHTML = PROJECTS[((index % N) + N) % N].n;
  }

  /* ===== 1930s film rattle — gate weave + roll jitter + lamp flicker ===== */
  const shakeEl = document.getElementById("shake");
  const flickerEl = document.getElementById("flicker");
  let rollAmp = 0;
  gsap.ticker.add(() => {
    const a = rollAmp;
    if (a < 0.001) {
      // dead still at rest
      shakeEl.style.transform = "";
      flickerEl.style.opacity = "0";
      return;
    }
    // one axis only — a tiny vertical gate weave. no x, no rotation.
    const t = performance.now() / 1000;
    const jy = Math.sin(t * 18) * 1 * a;
    shakeEl.style.transform = `translateY(${jy.toFixed(2)}px)`;
    flickerEl.style.opacity = (Math.random() * 0.08 * a).toFixed(3);
  });

  function currentProject() {
    return ((index % N) + N) % N;
  }

  /* one project step — wheel / arrows */
  function spin(dir) {
    doSpin(dir * (N * 2 + 1));
  }

  /* jump straight to a project — the navigate indicator */
  function spinTo(p) {
    const delta = (((p - currentProject()) % N) + N) % N;
    if (delta === 0) return;
    doSpin(N * 2 + delta);
  }

  /* THE JACKPOT SPIN — whip through 2 cycles, land clean */
  function doSpin(travel) {
    if (spinning || !ready || travel === 0) return;
    spinning = true;

    const dir = Math.sign(travel);
    const fromY = -index * frameH;
    const toY = -(index + travel) * frameH;
    const blur = { v: 0 };
    const amp = { v: 0 };

    const tl = gsap.timeline({
      onComplete() {
        index += travel;
        updateCounter();
        updateNav();
        rollAmp = 0;
        gsap.fromTo(flash, { opacity: 0.5 }, { opacity: 0, duration: 0.34, ease: "power2.out" });
        spinning = false;
      },
    });

    // reel travel — anticipation, then a clean decelerating spin (no overshoot)
    tl.to(reel, { y: fromY + dir * 44, duration: 0.13, ease: "power2.out" }, 0)
      .to(reel, { y: toY, duration: 1.2, ease: "power4.out" }, 0.13);

    // motion blur
    tl.to(blur, { v: 18, duration: 0.34, ease: "power2.in",
        onUpdate() { reel.style.filter = `blur(${blur.v}px)`; } }, 0.13)
      .to(blur, { v: 0, duration: 0.82, ease: "power3.out",
        onUpdate() { reel.style.filter = `blur(${blur.v}px)`; } }, 0.47);

    // the rattle — only mid-spin, fully gone well before the next one lands
    tl.to(amp, { v: 1, duration: 0.26, ease: "power2.in",
        onUpdate() { rollAmp = amp.v; } }, 0.13)
      .to(amp, { v: 0, duration: 0.46, ease: "power2.out",
        onUpdate() { rollAmp = amp.v; } }, 0.42);
  }

  let wheelLock = false;
  window.addEventListener("wheel", (e) => {
    if (wheelLock || spinning || !ready) return;
    if (Math.abs(e.deltaY) < 10) return;
    wheelLock = true;
    setTimeout(() => (wheelLock = false), 280);
    spin(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });

  let touchY = 0;
  window.addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener("touchend", (e) => {
    const d = touchY - e.changedTouches[0].clientY;
    if (Math.abs(d) > 50) spin(d > 0 ? 1 : -1);
  }, { passive: true });

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === " ") spin(1);
    if (e.key === "ArrowUp") spin(-1);
  });

  window.addEventListener("resize", () => {
    frameH = window.innerHeight - 60;
    gsap.set(reel, { y: -index * frameH });
  });
</script>
</body>
</html>
